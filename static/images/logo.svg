<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M32 4
           L54 12
           V29
           C54 44 44.5 54.5 32 60
           C19.5 54.5 10 44 10 29
           V12
           Z"
        fill="url(#shieldGrad)" />

  <!-- Inner network / detection nodes, representing packet monitoring -->
  <g stroke="url(#nodeGrad)" stroke-width="1.6" stroke-linecap="round" opacity="0.95">
    <line x1="22" y1="38" x2="32" y2="24" />
    <line x1="32" y1="24" x2="43" y2="34" />
    <line x1="32" y1="24" x2="26" y2="20" />
  </g>
  <circle cx="22" cy="38" r="3.4" fill="url(#nodeGrad)" />
  <circle cx="32" cy="24" r="4" fill="url(#nodeGrad)" />
  <circle cx="43" cy="34" r="3.4" fill="url(#nodeGrad)" />
  <circle cx="26" cy="20" r="2.6" fill="url(#nodeGrad)" />
</svg>
