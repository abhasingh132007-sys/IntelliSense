<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c4b5fd"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M32 3
           L54 11
           V29
           C54 45 45 55 32 61
           C19 55 10 45 10 29
           V11
           Z"
        fill="url(#shieldGrad)" />

  <!-- Inner network / node pattern representing packet monitoring -->
  <g stroke="rgba(255,255,255,0.55)" stroke-width="1.4" fill="none">
    <line x1="24" y1="24" x2="32" y2="34"/>
    <line x1="40" y1="22" x2="32" y2="34"/>
    <line x1="32" y1="34" x2="26" y2="46"/>
    <line x1="32" y1="34" x2="40" y2="45"/>
    <line x1="24" y1="24" x2="40" y2="22"/>
  </g>

  <circle cx="24" cy="24" r="3.4" fill="url(#nodeGrad)"/>
  <circle cx="40" cy="22" r="3.4" fill="url(#nodeGrad)"/>
  <circle cx="32" cy="34" r="4.2" fill="#ffffff"/>
  <circle cx="26" cy="46" r="3.4" fill="url(#nodeGrad)"/>
  <circle cx="40" cy="45" r="3.4" fill="url(#nodeGrad)"/>

  <!-- Center checkmark-style pulse to read as "protection" at a glance -->
  <circle cx="32" cy="34" r="1.6" fill="#4338ca"/>
</svg>
